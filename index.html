<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Flex Card - Interactive Card Designs with Hover Effects</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Discover beautifully animated flex card designs with hover effects and smooth transitions. Perfect for modern, interactive websites." />
    <meta name="keywords" content="animated flex card, CSS card animation, flexbox card design, interactive cards, HTML CSS design" />
    <meta name="author" content="Ashish Kamat" />
    <link rel="canonical" href="https://animated-flex-card.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Animated Flex Card - Interactive Card Designs" />
    <meta property="og:description" content="Explore stunning animated flex card designs with hover effects, perfect for engaging modern websites." />
    <meta property="og:url" content="https://animated-flex-card.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://animated-flex-card.vercel.app/assets/1.jpg" />

    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Animated Flex Card - Interactive Card Designs" />
    <meta name="twitter:description" content="Discover stunning animated flex cards with smooth hover effects." />
    <meta name="twitter:image" content="https://animated-flex-card.vercel.app/assets/1.jpg" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background-color: #eeeeea;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        height: 400px;
        display: flex;
        flex-wrap: nowrap;
        justify-content: start;
      }

      .card {
        width: 80px;
        border-radius: 2rem;
        background-size: cover;
        cursor: pointer;
        overflow: hidden;
        margin: 0 10px;
        display: flex;
        align-items: flex-end;
        transition: 0.6s cubic-bezier(0.28, -0.03, 0, 0.99);
        box-shadow: 0px 10px 30px -5px rgba(0, 0, 0, 0.8);
      }

      .card > .row {
        color: white;
        display: flex;
        flex-wrap: nowrap;
      }

      .card > .row > .icon {
        background: #233;
        color: white;
        border-radius: 50%;
        width: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 15px;
      }

      .description {
        position: relative;
        display: flex;
        justify-content: center;
        flex-direction: column;
        overflow: hidden;
        height: 80px;
        width: 520px;
        opacity: 0;
        transform: translateY(30px);
        transition-delay: 0.3s;
        transition: all 0.3s ease;
      }

      .description::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: -1;
        border-radius: inherit;
      }

      .description h4,
      .description p {
        position: relative;
        z-index: 1;
      }

      input {
        display: none;
      }

      input:checked + label {
        width: 600px;
      }

      input:checked + label .description {
        opacity: 1 !important;
        transform: translateY(0) !important;
      }

      .card[for="c1"] {
        background-image: url("./assets/1.jpg");
      }

      .card[for="c2"] {
        background-image: url("./assets/2.jpg");
      }

      .card[for="c3"] {
        background-image: url("./assets/3.jpg");
      }

      .card[for="c4"] {
        background-image: url("./assets/4.jpg");
      }

      header,
      footer {
        text-align: center;
        padding: 20px;
        background-color: #ccc;
      }

      footer a {
        color: #000;
        text-decoration: none;
      }

      h1,
      h2 {
        color: #333;
        text-align: center;
        margin: 20px 0 10px;
      }

      main {
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Animated Flex Card Designs</h1>
      <h2>Create Stunning and Interactive Flex Cards</h2>
    </header>

    <main>
      <div class="wrapper">
        <div class="container">
          <input type="radio" name="slide" id="c1" checked />
          <label for="c1" class="card">
            <div class="overlay"></div>
            <div class="row">
              <div class="icon" aria-label="Card 1">1</div>
              <div class="description">
                <h4>Winter</h4>
                <p>Winter has so much to offer - creative activities</p>
              </div>
            </div>
          </label>

          <input type="radio" name="slide" id="c2" />
          <label for="c2" class="card">
            <div class="overlay"></div>
            <div class="row">
              <div class="icon" aria-label="Card 2">2</div>
              <div class="description">
                <h4>Digital Technology</h4>
                <p>Gets better every day</p>
              </div>
            </div>
          </label>

          <input type="radio" name="slide" id="c3" />
          <label for="c3" class="card">
            <div class="overlay"></div>
            <div class="row">
              <div class="icon" aria-label="Card 3">3</div>
              <div class="description">
                <h4>New Technology</h4>
                <p>Space Engineering becomes more and more advanced</p>
              </div>
            </div>
          </label>

          <input type="radio" name="slide" id="c4" />
          <label for="c4" class="card">
            <div class="overlay"></div>
            <div class="row">
              <div class="icon" aria-label="Card 4">4</div>
              <div class="description">
                <h4>Mountain</h4>
                <p>Nature’s beauty in every peak</p>
              </div>
            </div>
          </label>
        </div>
      </div>
    </main>

    <footer>
      <p>Code by <a href="https://ashishkamat.com.np/" target="_blank" rel="noopener noreferrer">Ashish Kamat</a></p>
    </footer>
  </body>
</html>
